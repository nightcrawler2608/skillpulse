# Base Streamlit theme matching design/DESIGN_SYSTEM.md.
# Borders, shadows and heading fonts are added by app/theme.css in Phase 3.
[server]
maxUploadSize = 5   # MB; resumes only
headless = true

[browser]
gatherUsageStats = false   # no Streamlit telemetry: our privacy note promises only our own counts

[theme]
base = "light"
primaryColor = "#1C1C1C"
backgroundColor = "#D7E1E1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1C1C"
font = "sans serif"
