[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillpulse"
version = "0.1.0"
description = "Live job-market intelligence and resume gap analyzer for freshers in India"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Meaning-based skill matching (Layer B) and, later, job/resume embeddings
nlp = [
    "sentence-transformers>=3.0",
]
# Web app + labelling tool
app = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
# Exploratory analysis notebooks
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "nbformat>=5.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/ui.py" = ["C408"]   # dict(...) is the idiomatic way to write Plotly settings

[tool.ruff.lint.isort]
known-first-party = ["skillpulse", "ui", "data"]   # app/ modules are ours too
