[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillpulse"
version = "0.1.0"
description = "Live job-market intelligence and resume gap analyzer for freshers in India"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Meaning-based skill matching (Layer B) and, later, job/resume embeddings
nlp = [
    "sentence-transformers>=3.0",
]
# Web app + labelling tool
app = [
    "streamlit>=1.40",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
